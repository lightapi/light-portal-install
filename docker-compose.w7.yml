# Explicit owner-prepared W7 rollout gate; not required by normal installs.
services:
  w7-controller-page-readiness:
    # Distinct non-root UID, dedicated owner-reviewed private state group.
    user: "${W7_READINESS_UID:?owner-reviewed non-root readiness UID required}:${W7_READINESS_GID:?dedicated private readiness GID required}"
    image: ${CONTROLLER_RS_IMAGE:-networknt/controller-rs:latest}
    entrypoint: ["/bin/bash", "/opt/operational-store/bin/w7-controller-page-check.sh"]
    volumes:
      - ./postgres-db/operations/bin:/opt/operational-store/bin:ro,Z
      - ./postgres-db/operations/bundle:/opt/operational-store/bundle:ro,Z
      - ./postgres-db/operations/portal:/opt/operational-store/portal:ro,Z
      - ./postgres-db/operations/w7-assets.json:/opt/operational-store/w7-assets.json:ro,Z
      - ./postgres-db/operations/.runtime/w7:/opt/operational-store/.runtime/w7:Z
      - ./postgres-db/operations/.runtime/w7/controller-page-authorization:/run/secrets/w7-controller-page-authorization:ro,Z
      - ./light-controller-rust/ca.pem:/config/ca.pem:ro,Z
    depends_on:
      controller: {condition: service_healthy}
      operational-schema-validation: {condition: service_completed_successfully}
    restart: "no"

  light-workflow:
    depends_on:
      w7-controller-page-readiness: {condition: service_completed_successfully}
